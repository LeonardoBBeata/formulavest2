<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png">
  <title>Redefinir senha</title>
  <link rel="stylesheet" href="login.css">
  <script src="reset-password.js" defer></script>
</head>
<body>

  <div class="container">
    <div class="card">

      <h1>Nova senha</h1>

      <input
        id="nova-senha"
        type="password"
        placeholder="Digite sua nova senha"
      >

      <input
        id="confirmar-senha"
        type="password"
        placeholder="Confirme a nova senha"
      >

      <button id="salvar-btn">
        Salvar nova senha
      </button>

      <p id="mensagem"></p>

    </div>
  </div>

</body>
</html>
